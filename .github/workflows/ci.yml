name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -s bash \
            rootfs/usr/local/bin/kazama-entrypoint \
            rootfs/usr/local/lib/kazama/common.sh

  powershell:
    name: PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 / .psm1 / .psd1
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "OK  $($_.FullName)" }
          }
          if ($failed) { exit 1 }

  egg:
    name: Pterodactyl egg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the egg JSON
        run: |
          python3 - <<'PY'
          import json
          egg = json.load(open("pterodactyl/egg-kazama-windows.json"))
          assert egg["meta"]["version"] == "PTDL_v2"
          names = {v["env_variable"] for v in egg["variables"]}
          required = {"RDP_PASSWORD", "RDP_USERNAME", "WINDOWS_VERSION", "RAM_SIZE", "CPU_CORES", "DISK_SIZE", "APP_LANG",
                      "TAILSCALE_AUTHKEY", "TAILSCALE_HOSTNAME", "BOOSTER_MODE", "BOOSTER_SCHEDULE", "BOOSTER_KEEP",
                      "KAZAMA_WALLPAPER", "KAZAMA_TUNE"}
          missing = required - names
          assert not missing, f"missing variables: {missing}"
          print("egg OK:", len(names), "variables")
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kazama-windows:ci
      - name: Smoke test
        run: |
          # Must refuse to start without RDP_PASSWORD.
          if docker run --rm kazama-windows:ci; then exit 1; fi
          # Must reject unsupported Windows versions.
          if docker run --rm -e RDP_PASSWORD='Str0ng#Pass9' -e WINDOWS_VERSION=windows-2019 kazama-windows:ci; then exit 1; fi
          # Tailscale binaries and the in-Windows files must be in the image.
          docker run --rm --entrypoint bash kazama-windows:ci -c 'command -v tailscale tailscaled && ls /oem/install.bat /oem/kazama-booster.ps1 /oem/kazama-catalog.psd1'
